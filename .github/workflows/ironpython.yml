name: IronPython 2.7 compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ironpython:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download IronPython 2.7.12
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ipy.zip"
          Invoke-WebRequest -Uri "https://github.com/IronLanguages/ironpython2/releases/download/ipy-2.7.12/IronPython.2.7.12.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne "FE01EB6037411036F7F600736F9557B2EB44874CF1979252A4541349846505D7") {
            throw "IronPython zip checksum mismatch: $hash"
          }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP "ipy")
      - name: Compile and run Revit-side code under IronPython
        shell: pwsh
        run: |
          $env:IRONPYTHONPATH = Join-Path $env:RUNNER_TEMP "ipy\Lib"
          & (Join-Path $env:RUNNER_TEMP "ipy\net45\ipy.exe") scripts\ironpython_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
