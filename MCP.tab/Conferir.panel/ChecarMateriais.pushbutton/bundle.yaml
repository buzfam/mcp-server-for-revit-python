title: Checar materiais
tooltip: "Confere os materiais do mobiliário antes do render (nome no padrão OBJETO_MATERIAL_PARTE_NN, repetidos, genéricos, só material da categoria). Não usa IA e não altera o modelo. Shift+clique confere só o que aparece na vista ativa."
